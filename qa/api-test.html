<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>TechKtrek API Tester</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f1117;color:#e2e8f0;font-family:'Segoe UI',sans-serif;padding:24px}
  h1{color:#7c3aed;font-size:1.8rem;margin-bottom:8px}
  .subtitle{color:#94a3b8;margin-bottom:24px;font-size:.9rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
  .card{background:#1e2130;border:1px solid #2d3148;border-radius:12px;overflow:hidden}
  .card-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#252840}
  .method{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.5px}
  .GET{background:#065f46;color:#34d399}.POST{background:#1e3a5f;color:#60a5fa}
  .DELETE{background:#7f1d1d;color:#fca5a5}.PUT{background:#78350f;color:#fcd34d}
  .card-title{font-size:.9rem;font-weight:600;color:#e2e8f0}
  .endpoint{font-size:.75rem;color:#94a3b8;margin-left:auto;font-family:monospace}
  .status-badge{padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
  .ok{background:#064e3b;color:#34d399}.err{background:#7f1d1d;color:#fca5a5}.pending{background:#1e3a5f;color:#93c5fd}
  pre{font-size:.72rem;line-height:1.5;padding:14px;overflow:auto;max-height:220px;white-space:pre-wrap;word-break:break-all;color:#a5b4fc;background:#13151f}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #4f46e5;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .summary{display:flex;gap:20px;margin-bottom:24px;flex-wrap:wrap}
  .stat{background:#1e2130;border:1px solid #2d3148;border-radius:10px;padding:14px 22px;text-align:center}
  .stat-num{font-size:2rem;font-weight:700;color:#7c3aed}
  .stat-label{font-size:.8rem;color:#94a3b8;margin-top:2px}
  #progress{height:4px;background:#7c3aed;width:0%;transition:width .3s;margin-bottom:20px;border-radius:2px}
</style>
</head>
<body>
<h1>🚀 TechKtrek Blog API — Live Test Suite</h1>
<p class="subtitle">Testing all endpoints against http://localhost:5000</p>
<div id="progress"></div>
<div class="summary">
  <div class="stat"><div class="stat-num" id="total">0</div><div class="stat-label">Total Tests</div></div>
  <div class="stat"><div class="stat-num" id="passed" style="color:#34d399">0</div><div class="stat-label">Passed</div></div>
  <div class="stat"><div class="stat-num" id="failed" style="color:#fca5a5">0</div><div class="stat-label">Failed</div></div>
</div>
<div class="grid" id="grid"></div>

<script>
const BASE = 'http://localhost:5000';
let token='', adminToken='', postId='', commentId='', userId='';
let passed=0,failed=0,total=0;

function card(method,title,endpoint){
  const id='c'+Math.random().toString(36).slice(2);
  const d=document.createElement('div');
  d.className='card';
  d.innerHTML=`
    <div class="card-header">
      <span class="method ${method}">${method}</span>
      <span class="card-title">${title}</span>
      <span class="endpoint">${endpoint}</span>
      <span class="status-badge pending" id="s${id}"><span class="spinner"></span>Running</span>
    </div>
    <pre id="p${id}">…</pre>`;
  document.getElementById('grid').appendChild(d);
  return {
    setResult(ok,data){
      const s=document.getElementById('s'+id);
      s.className='status-badge '+(ok?'ok':'err');
      s.innerHTML=ok?data.status:(data.status||'Error');
      document.getElementById('p'+id).textContent=JSON.stringify(data.body,null,2).slice(0,1200);
      total++;ok?passed++:failed++;
      document.getElementById('total').textContent=total;
      document.getElementById('passed').textContent=passed;
      document.getElementById('failed').textContent=failed;
    }
  };
}

async function hit(method,path,body,headers={}){
  try{
    const opts={method,headers:{'Content-Type':'application/json',...headers}};
    if(body) opts.body=JSON.stringify(body);
    const r=await fetch(BASE+path,opts);
    const json=await r.json().catch(()=>({}));
    return {status:r.status,body:json};
  }catch(e){return {status:'NET_ERR',body:{error:e.message}};}
}

async function run(){
  const tests=[
    // ---- Health ----
    async()=>{
      const c=card('GET','Health Check','/api/health');
      const r=await hit('GET','/api/health');
      c.setResult(r.status===200,r);
      document.getElementById('progress').style.width='5%';
    },
    // ---- Auth ----
    async()=>{
      const c=card('POST','Register Admin','/api/auth/register');
      const r=await hit('POST','/api/auth/register',{name:'Test Admin',email:'admin@techtrek.io',password:'Admin@1234'});
      // 400 is fine (already exists from seed), 201 is new
      c.setResult(r.status===201||r.status===400,r);
      document.getElementById('progress').style.width='15%';
    },
    async()=>{
      const c=card('POST','Login — Admin','/api/auth/login');
      const r=await hit('POST','/api/auth/login',{email:'admin@techtrek.io',password:'Admin@1234'});
      if(r.body.token) adminToken=r.body.token;
      c.setResult(r.status===200,r);
      document.getElementById('progress').style.width='20%';
    },
    async()=>{
      const c=card('POST','Login — User','/api/auth/login');
      const r=await hit('POST','/api/auth/login',{email:'ahmed@techtrek.io',password:'User1@1234'});
      if(r.body.token){ token=r.body.token; if(r.body.data?.id) userId=r.body.data.id; }
      c.setResult(r.status===200,r);
      document.getElementById('progress').style.width='25%';
    },
    async()=>{
      const c=card('POST','Login — Wrong Password (401)','/api/auth/login');
      const r=await hit('POST','/api/auth/login',{email:'ahmed@techtrek.io',password:'wrongpass'});
      c.setResult(r.status===401,r);
      document.getElementById('progress').style.width='30%';
    },
    // ---- Posts ----
    async()=>{
      const c=card('GET','Get All Posts (public)','/api/posts');
      const r=await hit('GET','/api/posts');
      if(r.body.data?.posts?.[0]?._id) postId=r.body.data.posts[0]._id;
      c.setResult(r.status===200,r);
      document.getElementById('progress').style.width='38%';
    },
    async()=>{
      const c=card('GET','Get All Posts — paginated','/api/posts?page=1&limit=2');
      const r=await hit('GET','/api/posts?page=1&limit=2');
      c.setResult(r.status===200,r);
      document.getElementById('progress').style.width='42%';
    },
    async()=>{
      const c=card('GET','Get All Posts — search','/api/posts?search=Node');
      const r=await hit('GET','/api/posts?search=Node');
      c.setResult(r.status===200,r);
      document.getElementById('progress').style.width='45%';
    },
    async()=>{
      const c=card('GET','Get All Posts — filter by category','/api/posts?category=Backend');
      const r=await hit('GET','/api/posts?category=Backend');
      c.setResult(r.status===200,r);
      document.getElementById('progress').style.width='48%';
    },
    async()=>{
      const c=card('GET','Get Post By ID','/api/posts/:id');
      const r=await hit('GET','/api/posts/'+postId);
      c.setResult(r.status===200,r);
      document.getElementById('progress').style.width='52%';
    },
    async()=>{
      const c=card('POST','Create Post (auth required)','/api/posts');
      const r=await hit('POST','/api/posts',{title:'My Test Post',content:'Hello from API tester',category:'Tech',tags:['test']},{Authorization:'Bearer '+token});
      if(r.body.data?.post?._id) postId=r.body.data.post._id;
      c.setResult(r.status===201,r);
      document.getElementById('progress').style.width='58%';
    },
    async()=>{
      const c=card('POST','Create Post — No Auth (401)','/api/posts');
      const r=await hit('POST','/api/posts',{title:'Fail',content:'Fail',category:'Fail'});
      c.setResult(r.status===401,r);
      document.getElementById('progress').style.width='61%';
    },
    async()=>{
      const c=card('PUT','Update Post (owner)','/api/posts/:id');
      const r=await hit('PUT','/api/posts/'+postId,{title:'Updated Title',content:'Updated content',category:'Tech'},{Authorization:'Bearer '+token});
      c.setResult(r.status===200,r);
      document.getElementById('progress').style.width='65%';
    },
    // ---- Comments ----
    async()=>{
      const c=card('POST','Add Comment to Post','/api/posts/:id/comments');
      const r=await hit('POST','/api/posts/'+postId+'/comments',{text:'test'},{Authorization:'Bearer '+token});
      if(r.body.data?._id) commentId=r.body.data._id;
      c.setResult(r.status===201,r);
      document.getElementById('progress').style.width='70%';
    },
    async()=>{
      const c=card('DELETE','Delete Comment','/api/comments/:id');
      const r=await hit('DELETE','/api/comments/'+commentId,null,{Authorization:'Bearer '+token});
      c.setResult(r.status===200||r.status===204,r);
      document.getElementById('progress').style.width='75%';
    },
    // ---- Users ----
    async()=>{
      const c=card('GET','Get All Users (admin only)','/api/users');
      const r=await hit('GET','/api/users',null,{Authorization:'Bearer '+adminToken});
      c.setResult(r.status===200,r);
      document.getElementById('progress').style.width='80%';
    },
    async()=>{
      const c=card('GET','Get All Users — no admin (403)','/api/users');
      const r=await hit('GET','/api/users',null,{Authorization:'Bearer '+token});
      c.setResult(r.status===403,r);
      document.getElementById('progress').style.width='84%';
    },
    async()=>{
      const c=card('GET','Get User By ID','/api/users/:id');
      const r=await hit('GET','/api/users/'+userId,null,{Authorization:'Bearer '+token});
      if(!userId&&r.body.data?.user?._id) userId=r.body.data.user._id;
      c.setResult(r.status===200,r);
      document.getElementById('progress').style.width='88%';
    },
    // ---- Error cases ----
    async()=>{
      const c=card('GET','Invalid Post ID — 404','/api/posts/000000000000000000000000');
      const r=await hit('GET','/api/posts/000000000000000000000000');
      c.setResult(r.status===404,r);
      document.getElementById('progress').style.width='92%';
    },
    async()=>{
      const c=card('DELETE','Delete Post (owner)','/api/posts/:id');
      const r=await hit('DELETE','/api/posts/'+postId,null,{Authorization:'Bearer '+token});
      c.setResult(r.status===200||r.status===204,r);
      document.getElementById('progress').style.width='96%';
    },
    async()=>{
      const c=card('GET','404 Unknown Route','/api/unknown');
      const r=await hit('GET','/api/unknown');
      c.setResult(r.status===404,r);
      document.getElementById('progress').style.width='100%';
    },
  ];

  for(const t of tests){ await t(); await new Promise(r=>setTimeout(r,300)); }
}

run();
</script>
</body>
</html>
